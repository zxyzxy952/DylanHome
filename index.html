        body { background:#fefbff; }
        .nav-item { position:relative; }
        .nav-item::after { content:""; width:0; height:2px; background:#9c27b0; position:absolute; left:0; bottom:-3px; transition:0.3s ease; }

        .card-float{transition:0.4s ease;}
        .card-float:hover{transform:translateY(-6px);box-shadow:0 12px 30px #e9d5f2;}
        .modal-box{transition:0.5s ease;}
        .modal-img{transition:0.5s ease;}

        /* 铺满全屏 + 无浪费空间 + 横图创意网格 */
        .gallery-wrap{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 100%;
        }
        .gallery-wrap img{
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }
        @media(max-width:768px){
            .gallery-wrap{ grid-template-columns: repeat(2, 1fr); }

<div id="imgModal" class="fixed inset-0 bg-black/85 z-[999] hidden items-center justify-center modal-box opacity-0 p-4">

    <p class="mt-2 text-dylanLight/70">向阳而生 自在如风 💜</p>
</footer>

<script>
// TG机器人参数（已填好）
const BOT_TOKEN = '8981207217:AAG9XJwcgfrafa2pgLY98QyO5jsVDupRzxU';
const CHAT_ID = '6414933817';

const banners = ["./images/banner1.jpg","./images/banner2.jpg","./images/banner3.jpg"];
let idx = 0;
setInterval(()=>{
    idx=(idx+1)%3;
    document.getElementById("banner").style.backgroundImage=`url(${banners[idx]})`;
},4000);

function checkIn(){alert("✅ 打卡成功！今天也要喜欢棣棣哦~");}

const modal=document.getElementById("imgModal");
const modalImg=document.getElementById("modalImg");
function openImg(src){
    modal.classList.remove("hidden");
    setTimeout(()=>{modal.classList.remove("opacity-0");modalImg.classList.remove("scale-75");},20);
    modalImg.src=src;
}
function closeImg(){
    modalImg.classList.add("scale-75");
    modal.classList.add("opacity-0");
    setTimeout(()=>modal.classList.add("hidden"),500);
}

const quotes=["做自己，比什么都重要","向阳而生，自在如风","努力永远不会骗人","保持热爱，奔赴山海","我就是我，不一样的烟火","勇敢一点，你比想象中更强大","用实力证明，用态度说话"];
function getQuote(){
    let r=Math.floor(Math.random()*quotes.length);
    document.getElementById("quoteText").innerText=quotes[r];
}

function getLocalMsg(){return JSON.parse(localStorage.getItem("dylanMsg"))||[];}
function renderMsg(){
    let arr=getLocalMsg();
    const wrap=document.getElementById("msgList");
    if(arr.length===0){wrap.innerHTML="<p class='text-gray-400 text-center'>暂无留言，快来写下第一条吧~</p>";return;}
    wrap.innerHTML=arr.map(item=>`
    <div class="p-3 rounded-xl hover:bg-dylanBg border-b border-gray-100">
        <div class="flex justify-between">
            <span class="font-bold text-dylan">${item.name}</span>
            <span class="text-xs text-gray-400">${item.time}</span>
        </div>
        <p class="mt-1 text-gray-700">${item.content}</p>
    </div>`).join('');
}

async function sendMsg(){
    let name=document.getElementById("name").value.trim();
    let con=document.getElementById("content").value.trim();
    if(!name||!con){alert("请完善昵称和留言");return;}
    let list=getLocalMsg();
    let timeStr = new Date().toLocaleString();
    list.unshift({name,content:con,time:timeStr});
    localStorage.setItem("dylanMsg",JSON.stringify(list));
    document.getElementById("content").value="";
    renderMsg();

    let text = `【新留言】\n昵称：${name}\n内容：${con}\n时间：${timeStr}`;
    try{
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chat_id:CHAT_ID,text:text})
        })
        alert("留言发布成功，消息已推送TG！");
    }catch(err){
        alert("留言保存成功，TG推送失败，请先去TG给机器人发一条消息激活");
    }
}
window.onload=renderMsg;
</script>
