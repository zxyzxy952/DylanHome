<script>
const banners = ["./images/banner1.jpg","./images/banner2.jpg","./images/banner3.jpg"];
let idx = 0;
setInterval(()=>{
    idx=(idx+1)%3;
    document.getElementById("banner").style.backgroundImage=`url(${banners[idx]})`;
},4000);

const modal=document.getElementById("imgModal");
const modalImg=document.getElementById("modalImg");
function openImg(src){
    modal.classList.remove("hidden");
    setTimeout(()=>{modal.classList.remove("opacity-0");modalImg.classList.remove("scale-75");},20);
    modalImg.src=src;
}
function closeImg(){
    modalImg.classList.add("scale-75");
    modal.classList.add("opacity-0");
    setTimeout(()=>modal.classList.add("hidden"),500);
}

const quotes=["做自己，比什么都重要","向阳而生，自在如风","努力永远不会骗人","保持热爱，奔赴山海","我就是我，不一样的烟火","勇敢一点，你比想象中更强大","用实力证明，用态度说话"];
function getQuote(){
    let r=Math.floor(Math.random()*quotes.length);
    document.getElementById("quoteText").innerText=quotes[r];
}

//签到
let now=new Date();
let selYear=now.getFullYear();
let selMonth=now.getMonth();
function getSignArr(){
    let arr=localStorage.getItem("signDays");
    return arr?JSON.parse(arr):[];
}
function saveSignArr(arr){
    localStorage.setItem("signDays",JSON.stringify(arr));
}
function isSigned(y,m,d){
    let signList=getSignArr();
    let dayStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return signList.includes(dayStr);
}
function calcSignData(){
    let list=getSignArr().sort();
    let total=list.length;
    let continueDay=0;
    let check=new Date();
    for(let i=0;i<366;i++){
        let s=`${check.getFullYear()}-${String(check.getMonth()+1).padStart(2,'0')}-${String(check.getDate()).padStart(2,'0')}`;
        if(list.includes(s)){
            continueDay++;
            check.setDate(check.getDate()-1);
        }else break;
    }
    document.getElementById("totalSign").innerText=total;
    document.getElementById("continueSign").innerText=continueDay;
}
function renderCalendar(y,m){
    const first=new Date(y,m,1);
    const last=new Date(y,m+1,0);
    const firstWeek=first.getDay();
    const totalDay=last.getDate();
    const wrap=document.getElementById("calendarBody");
    wrap.innerHTML="";
    document.getElementById("ymText").innerText=`${y}年${m+1}月`;
    let today=new Date();
    let tY=today.getFullYear(),tM=today.getMonth(),tD=today.getDate();
    for(let i=0;i<firstWeek;i++) wrap.innerHTML+='<div class="calendar-day"></div>';
    for(let d=1;d<=totalDay;d++){
        let cls="calendar-day";
        if(isSigned(y,m,d)) cls+=" signed-day";
        if(y===tY&&m===tM&&d===tD) cls+=" today-day";
        wrap.innerHTML+=`<div class="${cls}">${d}</div>`;
    }
    calcSignData();
}
function preMonth(){selMonth--;if(selMonth<0){selMonth=11;selYear--;}renderCalendar(selYear,selMonth);}
function nextMonth(){selMonth++;if(selMonth>11){selMonth=0;selYear++;}renderCalendar(selYear,selMonth);}
function userSign(){
    const today=new Date();
    const s=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    let arr=getSignArr();
    if(arr.includes(s)){alert("今日已完成签到，明天再来~");return;}
    arr.push(s);saveSignArr(arr);renderCalendar(selYear,selMonth);alert("✅签到成功！");
}

//留言【最终修复：内存常驻数组，先发本地立刻渲染，后台异步上传云端】
const BIN_ID = "669c779ee47aa559ed4b7e28";
const API_KEY = "$2a$10$eImiTXuWVxfM37uY4JURcOH7gHJ22KkX4cO9g5X7X7X7X7X7";
let msgList = []; //全局常驻留言数组，永久保存在内存

//从云端拉取初始化
async function initMsg(){
    try{
        let res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEY}});
        let json=await res.json();
        msgList = Array.isArray(json.record) ? json.record : [];
    }catch{
        msgList=[];
    }
    renderMsgDom();
}

//只渲染页面DOM
function renderMsgDom(){
    const wrap=document.getElementById("msgList");
    if(msgList.length===0){
        wrap.innerHTML="<p class='text-gray-400 text-center'>暂无留言，快来写下第一条吧~</p>";
        return;
    }
    wrap.innerHTML=msgList.map(item=>`
    <div class="p-3 rounded-xl hover:bg-dylanBg border-b border-gray-100">
        <div class="flex justify-between">
            <span class="font-bold text-dylan">${item.name}</span>
            <span class="text-xs text-gray-400">${item.time}</span>
        </div>
        <p class="mt-1 text-gray-700">${item.content}</p>
    </div>`).join('');
}

//后台异步上传，不阻塞页面渲染
async function syncCloud(){
    try{
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
            method:"PUT",
            headers:{"X-Master-Key":API_KEY,"Content-Type":"application/json"},
            body:JSON.stringify(msgList)
        })
    }catch(e){}
}

//发布留言核心
function sendMsg(){
    let name=document.getElementById("name").value.trim();
    let con=document.getElementById("content").value.trim();
    if(!name||!con){alert("请完善昵称和留言");return;}
    //1.优先插入本地数组
    let newMsg={name,content:con,time:new Date().toLocaleString()};
    msgList.unshift(newMsg);
    //2.立刻渲染页面，马上显示，不再等接口
    renderMsgDom();
    //3.清空输入框
    document.getElementById("name").value="";
    document.getElementById("content").value="";
    //4.后台悄悄上传云端，异步不等待
    syncCloud();
    alert("留言发布成功，全设备同步！");
}

window.onload=async()=>{
    renderCalendar(selYear,selMonth);
    await initMsg();
}
</script>
